# Local environment: emulated AWS, the services, the frontend and observability. Guide: docs/ejecucion-local.md
#
#   docker compose up -d --build          start everything. Jobs run once, in order, then exit:
#                                         seed -> training -> scoring -> backtest -> monitoring
#   docker compose ps -a                  finished jobs show "Exited (0)"; the rest stay "Up"
#   docker compose logs monitoring        output of a job (training prints model metrics, monitoring precision)
#
#   http://localhost:8080                 frontend (at-risk customers, customer detail, model performance)
#   http://localhost:3000                 Grafana: API and load-test dashboard (no login)
#   http://localhost:8000/docs            API
#
#   docker compose run --rm --no-deps scoring      run the monthly scoring again (= the AWS schedule)
#   docker compose run --rm --no-deps monitoring   refresh the model performance report
#   docker compose run --rm --no-deps training     retrain (then run scoring to use the new model)
#   docker compose --profile loadtest run --rm loadtest                   k6 at 500 req/s for 5 min
#   SCENARIO=ramp docker compose --profile loadtest run --rm loadtest     ramp to find the saturation point
#   docker compose down                   stop and remove everything (DynamoDB data is in memory)

x-aws-env: &aws-env
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_REGION: us-west-2
  # One endpoint per AWS service; on real AWS none of these are set.
  AWS_ENDPOINT_URL_S3: http://localstack:4566
  AWS_ENDPOINT_URL_DYNAMODB: http://dynamodb:8000

# All jobs share one image; the command picks the job.
x-jobs: &jobs
  build:
    context: ./src
    target: jobs
  image: churn-jobs:local
  environment: *aws-env
  restart: "no"

services:
  # ---- Emulated AWS services ----------------------------------------------------------------------
  localstack:            # S3 (= the S3 bucket)
    image: localstack/localstack:4.4
    ports:
      - '4566:4566'
    environment:
      - SERVICES=s3

  dynamodb:              # DynamoDB (= the ChurnPredictions table). Faster than LocalStack's DynamoDB.
    image: amazon/dynamodb-local:2.5.2
    # -sharedDb: one database whatever credentials/region the client uses (host CLI and containers).
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
    ports:
      - '8001:8000'

  # ---- Jobs: run once and exit ---------------------------------------------------------------------
  seed:                  # local only: creates bucket + table, lands synthetic source data in S3 raw/
    <<: *jobs
    command: ["python", "-m", "churn.localdev"]
    depends_on:
      localstack:
        condition: service_healthy
      dynamodb:
        condition: service_started

  training:              # = ECS Fargate scheduled task: features -> XGBoost -> model version in S3
    <<: *jobs
    command: ["python", "-m", "churn.training"]
    depends_on:
      seed:
        condition: service_completed_successfully

  scoring:               # = monthly Lambda: features -> latest model -> DynamoDB (only writer)
    <<: *jobs
    command: ["python", "-m", "churn.scoring"]
    depends_on:
      training:
        condition: service_completed_successfully

  backtest:              # local only: past months' predictions from point-in-time models -> S3 predictions/
    <<: *jobs
    command: ["python", "-m", "churn.localdev.backtest"]
    depends_on:
      scoring:
        condition: service_completed_successfully

  monitoring:            # = monthly scheduled task: past predictions vs real outcomes -> S3 monitoring/
    <<: *jobs
    command: ["python", "-m", "churn.monitoring"]
    depends_on:
      backtest:
        condition: service_completed_successfully

  # ---- Always on -----------------------------------------------------------------------------------
  api:                   # = Lambda + API Gateway (or ECS service): reads DynamoDB and the S3 report
    build:
      context: ./src
      target: api
    image: churn-api:local
    environment: *aws-env
    ports:
      - '8000:8000'
    depends_on:
      scoring:
        condition: service_completed_successfully

  frontend:              # = S3 + CloudFront: static files, /api proxied to the API
    image: nginx:1.27-alpine
    ports:
      - '8080:80'
    volumes:
      - './frontend/public:/usr/share/nginx/html:ro'
      - './frontend/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro'
    depends_on:
      - api

  # ---- Observability (= CloudWatch / Amazon Managed Prometheus + Grafana on AWS) -------------------
  prometheus:            # scrapes the API's /metrics; receives k6 metrics by remote write
    image: prom/prometheus:v3.15.0
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.enable-remote-write-receiver'
    ports:
      - '9090:9090'
    volumes:
      - './observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro'

  grafana:               # dashboard "Churn API & load tests", provisioned from observability/grafana
    image: grafana/grafana:13.2.3
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/churn-api.json
    ports:
      - '3000:3000'
    volumes:
      - './observability/grafana/provisioning:/etc/grafana/provisioning:ro'
      - './observability/grafana/dashboards:/var/lib/grafana/dashboards:ro'
    depends_on:
      - prometheus

  # ---- On demand only (not started by `up`) --------------------------------------------------------
  loadtest:
    image: grafana/k6:1.3.0
    profiles: ["loadtest"]
    command: ["run", "--out", "experimental-prometheus-rw", "/scripts/k6.js"]
    environment:
      BASE_URL: http://api:8000
      SCENARIO: ${SCENARIO:-steady}
      RATE: ${RATE:-500}
      DURATION: ${DURATION:-5m}
      MAX_RATE: ${MAX_RATE:-2000}
      RAMP_DURATION: ${RAMP_DURATION:-5m}
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_STATS: p(50),p(95),p(99),max
    volumes:
      - './loadtest:/scripts:ro'
    depends_on:
      - prometheus
