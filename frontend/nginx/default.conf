# Serves the static frontend and proxies /api/* to the API container, so the browser talks to one
# origin (no CORS). On AWS the same split is CloudFront: S3 for the files, the API behind /api.
server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        # The trailing slash strips the /api prefix: /api/churn/summary -> http://api:8000/churn/summary
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}
