# Prometheus for the local stack: scrapes the API every 5 s; k6 pushes its metrics here through
# remote write (Prometheus runs with --web.enable-remote-write-receiver).
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: churn-api
    metrics_path: /metrics
    static_configs:
      - targets: ['api:8000']
