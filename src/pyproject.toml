[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "churn"
version = "0.1.0"
description = "Churn prediction platform for SaaS: synthetic data, XGBoost training, batch scoring to DynamoDB."
requires-python = ">=3.10"
# Only what every service needs. Each service image installs its own extra on top:
#   api image  -> churn[api]    (no pandas / XGBoost: small image, fast cold start)
#   jobs image -> churn[jobs]   (training, scoring and the local seed job)
dependencies = [
  "boto3>=1.34",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "prometheus-client>=0.20",
]
jobs = [
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=15",
  "xgboost>=2.0",
  "scikit-learn>=1.4",
]
dev = [
  "churn[api,jobs]",
  "pytest>=8",
  "moto[s3,dynamodb]>=5.0",
  "httpx>=0.27",
]

[project.scripts]
churn = "churn.cli:main"

[tool.setuptools.packages.find]
include = ["churn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
